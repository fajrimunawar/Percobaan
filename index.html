<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotrink</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: #ffffff;
    /* Font sistem yang bersih dan modern */
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
}

/* =========================================
   GAMBAR WEBSITE (LEBAR PENUH)
   ========================================= */
.website-image {
    width: 100%;
    height: 380px; 
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #ffffff;
}

.website-image img {
    display: block;
    width: 100%; 
    height: 100%; 
    object-fit: fill; 
}

/* AREA TEKS BERJALAN */
.marquee {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    background: #ffffff;
    border-bottom: 1px solid #e8e8e8;
    padding: 19px 0;
}

.marquee-track {
    display: inline-block;
    will-change: transform;
    animation: marquee-scroll 30s linear infinite;
}

.marquee-item {
    display: inline-flex;
    align-items: center;
    padding-right: 60px;
}

.marquee-item span {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.8px;
    color: #292929;
    text-transform: uppercase;
}

.marquee-item .brand {
    font-weight: 800;
    letter-spacing: 3px;
    color: #111111;
}

.marquee-item .divider {
    margin: 0 24px;
    color: #a5a5a5;
    font-size: 12px;
}

@keyframes marquee-scroll {
    0% { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
}

/* =========================================
   SECTION 3 KOTAK (BESAR, MEWAH & BERKELAS)
   ========================================= */
.info-cards-section {
    width: 100%;
    padding: 80px 40px; /* Padding lebih besar untuk kesan lega */
    background: #f4f7f6; /* Warna latar yang sedikit kontras dengan kotak putih */
    display: flex;
    justify-content: center;
    gap: 40px; /* Jarak antar kotak yang lebar */
    flex-wrap: wrap;
}

/* Desain Kotak Utama */
.card {
    background: #ffffff;
    border-radius: 16px; /* Sudut lebih melengkung, elegan */
    overflow: hidden;
    flex: 1;
    min-width: 320px;
    max-width: 500px; /* Batas lebar maksimal agar proporsional */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* Bayangan halus mewah */
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
    border: 1px solid #f0f0f0;
    display: flex;
    flex-direction: column;
}

/* Efek Hover: Kotak naik dan bayangan lebih tebal */
.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
}

/* Area Gambar */
.card-image {
    width: 100%;
    height: 280px; /* Gambar dibuat tinggi agar terlihat gagah */
    overflow: hidden;
    background: #e9ecef;
    position: relative;
}

.card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Menjaga proporsi gambar agar tidak gepeng */
    transition: transform 0.6s ease;
}

/* Efek Hover: Gambar zoom perlahan */
.card:hover .card-image img {
    transform: scale(1.08);
}

/* Area Judul di Bawah Gambar */
.card-title-wrapper {
    padding: 30px 20px;
    text-align: center;
    background: #ffffff;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-top: 4px solid #0056b3; /* Garis biru tegas di atas judul */
}

/* Gaya Teks Judul */
.card-title {
    font-size: 22px;
    font-weight: 800; /* Sangat tebal */
    color: #1a1a1a;
    letter-spacing: 2px; /* Jarak huruf lebar untuk kesan premium */
    text-transform: uppercase;
    line-height: 1.3;
}

/* Garis aksen emas kecil di bawah judul */
.card-title-wrapper::after {
    content: '';
    display: block;
    width: 60px;
    height: 3px;
    background: #d4af37; /* Warna emas */
    margin-top: 15px;
}

/* =========================================
   RESPONSIVE UNTUK TABLET DAN HP
   ========================================= */
@media (max-width: 1024px) {
    .info-cards-section {
        padding: 60px 30px;
        gap: 30px;
    }
}

@media (max-width: 600px) {
    .website-image {
        height: 200px; 
    }

    .marquee {
        padding: 16px 0;
    }

    .marquee-item span {
        font-size: 11px;
        letter-spacing: 1.3px;
    }
    
    .marquee-track {
        animation-duration: 22s; 
    }

    .info-cards-section {
        padding: 40px 20px;
    }

    .card {
        width: 100%; /* Satu kolom penuh di HP */
        max-width: 100%;
        min-width: 100%;
    }

    .card-image {
        height: 220px; /* Sedikit lebih pendek di HP */
    }

    .card-title {
        font-size: 18px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .marquee-track {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- GAMBAR UTAMA -->
<main class="website-image">
    <img
        src="file_0000000005b0821198b8019f43a73116.webp"
        alt="Infotrink Banner"
    >
</main>

<!-- TEKS BERJALAN -->
<section class="marquee">
    <div class="marquee-track">
        <div class="marquee-item">
            <span class="brand">INFOTRINK</span>
            <span class="divider">|</span>
            <span>Pusat Media Digital Terpercaya yang Menghimpun, Mengemas, dan Menyajikan Informasi serta Perkembangan Terkini dari Beragam Aspek Kehidupan dalam Satu Wadah Terpadu, Akurat, dan Berkelas</span>
            <span class="divider">◆</span>
        </div>
    </div>
</section>

<!-- SECTION 3 KOTAK BESAR -->
<section class="info-cards-section">
    
    <!-- Kotak 1 -->
    <div class="card">
        <div class="card-image">
            <!-- Gambar tema Pengetahuan/Perpustakaan -->
            <img src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Pengetahuan Infotrink">
        </div>
        <div class="card-title-wrapper">
            <div class="card-title">PENGETAHUAN INFOTRINK</div>
        </div>
    </div>

    <!-- Kotak 2 -->
    <div class="card">
        <div class="card-image">
            <!-- Gambar tema Struktur/Arsitektur/Bangunan -->
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Struktur Kerangka">
        </div>
        <div class="card-title-wrapper">
            <div class="card-title">STRUKTUR KERANGKA</div>
        </div>
    </div>

    <!-- Kotak 3 -->
    <div class="card">
        <div class="card-image">
            <!-- Gambar tema Data/Digital/Pusat Informasi -->
            <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Pusat Informasi">
        </div>
        <div class="card-title-wrapper">
            <div class="card-title">PUSAT INFORMASI</div>
        </div>
    </div>

</section>

</body>
</html>
