<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotrink — Premium Ecosystem</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #030712;
    background-image: 
      radial-gradient(circle at center, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #f3f4f6;
    overflow: hidden;
    height: 100vh;
  }

  /* Wrapper untuk SVG dan HTML Card */
  #app-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

  /* ================= GARIS AKAR (SVG) ================= */
  .root-base {
    fill: none;
    stroke: #10b981; /* Warna Emerald */
    stroke-linecap: round;
    opacity: 0.3;
    animation: draw 2s ease-out forwards;
  }

  .root-glow {
    fill: none;
    stroke: #34d399;
    stroke-linecap: round;
    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;
    filter: drop-shadow(0 0 6px #10b981);
    animation: draw 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  /* ================= PUSAT (INFOTRINK) ================= */
  .center-wrapper {
    position: absolute;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
    border: 2px solid #10b981;
    box-shadow: 0 0 50px rgba(16, 185, 129, 0.4), inset 0 0 20px rgba(16, 185, 129, 0.5);
    animation: pulseCenter 4s infinite alternate;
  }

  @keyframes pulseCenter {
    0% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.3), inset 0 0 20px rgba(16, 185, 129, 0.4); }
    100% { box-shadow: 0 0 80px rgba(16, 185, 129, 0.6), inset 0 0 30px rgba(16, 185, 129, 0.6); }
  }

  .center-wrapper h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ecfdf5;
    text-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
  }

  .center-wrapper p {
    font-size: 9px;
    letter-spacing: 3px;
    color: #34d399;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* ================= KARTU CABANG ================= */
  .nodes-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; /* Biarkan klik tembus ke kartu */
    z-index: 5;
  }

  .node-card {
    position: absolute;
    width: 160px;
    background: rgba(17, 24, 39, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 16px;
    overflow: hidden;
    pointer-events: auto;
    cursor: pointer;
    transform: translate(-50%, -50%) scale(0.8);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
    text-decoration: none;
    display: flex;
    flex-direction: column;
  }

  /* Animasi muncul */
  .node-card.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  .node-card:hover {
    transform: translate(-50%, -55%) scale(1.05);
    border-color: #34d399;
    box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.4);
    z-index: 20;
  }

  /* Gambar di dalam kotak */
  .node-image {
    width: 100%;
    height: 90px;
    background-size: cover;
    background-position: center;
    border-bottom: 1px solid rgba(16, 185, 129, 0.2);
    position: relative;
  }

  /* Overlay gradasi di gambar */
  .node-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 0%, rgba(17, 24, 39, 0.9) 100%);
  }

  /* Teks di bawah gambar */
  .node-info {
    padding: 12px 14px;
    text-align: center;
  }

  .node-title {
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .node-category {
    font-size: 9px;
    color: #34d399;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* ================= DETAIL PANEL (POPUP) ================= */
  #detail-panel {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(150%);
    background: rgba(17, 24, 39, 0.9);
    backdrop-filter: blur(16px);
    border: 1px solid #10b981;
    border-radius: 16px;
    padding: 20px 30px;
    text-align: center;
    min-width: 320px;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }

  #detail-panel.show {
    transform: translateX(-50%) translateY(0);
  }

  #detail-panel h3 {
    font-size: 18px;
    color: #ecfdf5;
    margin-bottom: 6px;
  }

  #detail-panel p {
    font-size: 13px;
    color: #9ca3af;
  }

  /* Title Atas */
  .top-brand {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 8px;
    color: rgba(52, 211, 153, 0.5);
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="top-brand">Infotrink Ecosystem</div>

<div id="app-container">
  <!-- SVG untuk Garis Akar -->
  <svg id="svg-canvas"></svg>

  <!-- Pusat Infotrink -->
  <div class="center-wrapper" id="center-node">
    <h1>INFOTRINK</h1>
    <p>Wadah Informasi</p>
  </div>

  <!-- Container untuk Kotak Cabang -->
  <div class="nodes-container" id="nodes-container"></div>
</div>

<!-- Panel Detail saat diklik -->
<div id="detail-panel">
  <h3 id="d-title"></h3>
  <p id="d-desc"></p>
</div>

<script>
  // ================= DATA CABANG =================
  // Kamu bisa ganti URL gambar dengan link gambar asli perusahaan/kreator
  const branches = [
    { 
      label: "PT HAULUO MANDIRI UTAMA", 
      category: "Perusahaan", 
      desc: "Mitra utama penyedia layanan infotrink.",
      angle: 30,  // Derajat (0 = kanan, 90 = bawah)
      dist: 280,  // Jarak dari pusat
      img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=400&auto=format&fit=crop" 
    },
    { 
      label: "Akun Kreatif YouTube", 
      category: "Media Kreatif", 
      desc: "Kanal konten video kreatif & informatif.",
      angle: 90, 
      dist: 320, 
      img: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=400&auto=format&fit=crop" 
    },
    { 
      label: "Layanan Digital", 
      category: "Teknologi", 
      desc: "Solusi dan infrastruktur digital.",
      angle: 150, 
      dist: 280, 
      img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=400&auto=format&fit=crop" 
    },
    { 
      label: "Komunitas Kreator", 
      category: "Jaringan", 
      desc: "Wadah kolaborasi antar kreator.",
      angle: 210, 
      dist: 300, 
      img: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=400&auto=format&fit=crop" 
    },
    { 
      label: "Portfolio Karya", 
      category: "Galeri", 
      desc: "Kumpulan karya dan proyek terbaik.",
      angle: 270, 
      dist: 320, 
      img: "https://images.unsplash.com/photo-1542744173-8e7e53415bb0?q=80&w=400&auto=format&fit=crop" 
    },
    { 
      label: "Hubungi Kami", 
      category: "Kontak", 
      desc: "Hubungi tim Infotrink untuk kerja sama.",
      angle: 330, 
      dist: 280, 
      img: "https://images.unsplash.com/photo-1423666639041-f56000c27a9a?q=80&w=400&auto=format&fit=crop" 
    }
  ];

  const svg = document.getElementById('svg-canvas');
  const nodesContainer = document.getElementById('nodes-container');
  
  // Fungsi untuk menggambar
  function draw() {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    
    // Set viewBox SVG agar sesuai layar
    svg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
    
    // Hapus isi lama jika ada (saat resize)
    svg.innerHTML = '';
    nodesContainer.innerHTML = '';

    branches.forEach((b, i) => {
      // 1. Hitung posisi ujung akar (Titik Cabang)
      const rad = b.angle * Math.PI / 180;
      // Skala jarak jika layar kecil
      const scale = window.innerWidth < 768 ? 0.55 : 1; 
      const currentDist = b.dist * scale;
      
      const x = cx + Math.cos(rad) * currentDist;
      const y = cy + Math.sin(rad) * currentDist;

      // 2. Buat Garis Akar (Bezier Curve agar melengkung cantik)
      // Titik kontrol dibuat melengkung sedikit agar tidak kaku
      const ctrlX = cx + Math.cos(rad) * (currentDist * 0.4) + (Math.sin(rad) * 50);
      const ctrlY = cy + Math.sin(rad) * (currentDist * 0.4) - (Math.cos(rad) * 50);

      const pathBase = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathBase.setAttribute("d", `M ${cx} ${cy} Q ${ctrlX} ${ctrlY} ${x} ${y}`);
      pathBase.setAttribute("class", "root-base");
      pathBase.setAttribute("stroke-width", "4"); // Garis dasar lebih tebal
      svg.appendChild(pathBase);

      const pathGlow = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathGlow.setAttribute("d", `M ${cx} ${cy} Q ${ctrlX} ${ctrlY} ${x} ${y}`);
      pathGlow.setAttribute("class", "root-glow");
      pathGlow.setAttribute("stroke-width", "1.5"); // Garis menyala lebih tipis
      pathGlow.style.animationDelay = `${i * 0.15}s`;
      svg.appendChild(pathGlow);

      // 3. Buat Kotak Cabang (HTML Element)
      const card = document.createElement('a');
      card.href = "#"; // Ganti dengan link asli jika perlu
      card.className = "node-card";
      card.style.left = `${x}px`;
      card.style.top = `${y}px`;
      card.style.animationDelay = `${0.8 + (i * 0.1)}s`; // Delay animasi muncul

      // Isi HTML Kotak
      card.innerHTML = `
        <div class="node-image" style="background-image: url('${b.img}');"></div>
        <div class="node-info">
          <div class="node-title">${b.label}</div>
          <div class="node-category">${b.category}</div>
        </div>
      `;

      // Interaksi Klik (Tampilkan detail)
      card.addEventListener('click', (e) => {
        e.preventDefault(); // Mencegah pindah halaman
        showDetail(b);
      });

      nodesContainer.appendChild(card);
      
      // Trigger animasi masuk setelah diload
      setTimeout(() => {
        card.classList.add('show');
      }, 100);
    });
  }

  // Fungsi Popup Detail
  function showDetail(b) {
    const panel = document.getElementById('detail-panel');
    document.getElementById('d-title').textContent = b.label;
    document.getElementById('d-desc').textContent = b.desc + " — " + b.category;
    
    panel.classList.add('show');
    
    clearTimeout(window.detailTimeout);
    window.detailTimeout = setTimeout(() => {
      panel.classList.remove('show');
    }, 4000);
  }

  // Jalankan saat load dan saat resize (biar responsif)
  window.addEventListener('load', draw);
  window.addEventListener('resize', draw);

</script>

</body>
</html>
