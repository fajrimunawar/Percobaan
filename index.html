<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotrink</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: #ffffff;
}

/* GAMBAR WEBSITE */
.website-image {
    width: 100%;
    height: auto;
}

.website-image img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* AREA TEKS BERJALAN */
.marquee {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    background: #ffffff;
    border-bottom: 1px solid #e8e8e8;
    padding: 19px 0;
}

/* ANIMASI BERULANG */
.marquee-track {
    display: inline-block;
    will-change: transform;
    /* 
       Durasi 30s: Waktu yang pas untuk teks yang cukup panjang. 
       Tidak terlalu cepat, tidak terlalu lambat. Terkesan profesional.
    */
    animation: marquee-scroll 30s linear infinite;
}

/* ISI TEKS */
.marquee-item {
    display: inline-flex;
    align-items: center;
    padding-right: 60px;
}

.marquee-item span {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.8px;
    color: #292929;
    text-transform: uppercase;
}

.marquee-item .brand {
    font-weight: 800;
    letter-spacing: 3px;
    color: #111111;
}

.marquee-item .divider {
    margin: 0 24px;
    color: #a5a5a5;
    font-size: 12px;
}

/* 
   Animasi: Mulai dari luar layar kanan (100vw), 
   berjalan mulus ke kiri sampai hilang (-100%).
*/
@keyframes marquee-scroll {
    0% {
        transform: translateX(100vw);
    }
    100% {
        transform: translateX(-100%);
    }
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .marquee {
        padding: 16px 0;
    }

    .marquee-item span {
        font-size: 11px;
        letter-spacing: 1.3px;
    }

    .marquee-item .divider {
        margin: 0 17px;
    }
    
    /* Di HP, karena layar lebih sempit, durasi disesuaikan agar tidak terlalu cepat */
    .marquee-track {
        animation-duration: 22s; 
    }
}

@media (prefers-reduced-motion: reduce) {
    .marquee-track {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- GAMBAR UTAMA -->
<main class="website-image">
    <img
        src="file_0000000005b0821198b8019f43a73116.webp"
        alt="Infotrink Banner"
    >
</main>

<!-- TEKS BERJALAN -->
<section class="marquee">
    <div class="marquee-track">

        <!-- Kalimat diperpanjang & dibuat lebih profesional -->
        <div class="marquee-item">
            <span class="brand">INFOTRINK</span>
            <span class="divider">|</span>
            <span>Pusat Media Digital Terpercaya yang Menghimpun, Mengemas, dan Menyajikan Informasi serta Perkembangan Terkini dari Beragam Aspek Kehidupan dalam Satu Wadah Terpadu, Akurat, dan Berkelas</span>
            <span class="divider">◆</span>
        </div>

    </div>
</section>

</body>
</html>
