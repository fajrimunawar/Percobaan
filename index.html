<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOTRINK - Digital Information & Knowledge Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #051937;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* 1. SPANDUK ATAS (Penuh pojok kiri ke kanan, utuh tanpa terpotong) */
        .spanduk-atas {
            width: 100%;
            line-height: 0;
            position: relative;
            z-index: 5;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .spanduk-atas img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2. WADAH BELAH DUA FULL LAYAR + LINGKARAN TENGAH */
        .split-section {
            position: relative;
            width: 100%;
            display: flex;
            min-height: clamp(320px, 46vw, 640px);
            overflow: hidden;
            background-color: #061e42;
        }

        /* PANEL KIRI & KANAN (Saling bertemu di garis tengah) */
        .panel-sisi {
            position: relative;
            width: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.35s ease;
        }

        .panel-kiri {
            background: linear-gradient(145deg, #062147 0%, #0d4b96 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.22);
        }

        .panel-kanan {
            background: linear-gradient(215deg, #072857 0%, #135eb8 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.22);
        }

        /* Gambar pada Kotak Kiri & Kotak Kanan */
        .panel-sisi img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
        }

        .panel-sisi:hover img {
            transform: scale(1.04);
        }

        /* Lapisan gradasi halus agar transisi warna lebih dalam dan profesional */
        .panel-sisi::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(4, 20, 46, 0.12) 0%, rgba(4, 20, 46, 0.38) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* LINGKARAN TENGAH (Tepat di titik tengah perbatasan kiri & kanan) */
        .lingkaran-tengah {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(165px, 24vw, 340px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: linear-gradient(160deg, #ffffff 0%, #e4eef9 100%);
            border: clamp(4px, 0.65vw, 9px) solid #ffffff;
            box-shadow: 0 0 0 clamp(2px, 0.3vw, 4px) rgba(20, 94, 184, 0.45);
            z-index: 10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .lingkaran-tengah:hover {
            transform: translate(-50%, -50%) scale(1.04);
        }

        .lingkaran-tengah img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 1. SPANDUK ATAS -->
    <header class="spanduk-atas">
        <img src="file_00000000c808821199b244f777bdb40f.png" alt="Spanduk INFOTRINK">
    </header>

    <!-- 2. KOTAK KIRI - LINGKARAN TENGAH - KOTAK KANAN (SEMUA BERUPA GAMBAR) -->
    <section class="split-section">

        <!-- Gambar Kotak Kiri (Ganti nama file di src sesuai gambar kiri Anda) -->
        <div class="panel-sisi panel-kiri">
            <img src="gambar-kiri.jpg" alt="Visual Kiri">
        </div>

        <!-- Gambar Lingkaran Tengah (Ganti nama file di src sesuai gambar tengah Anda) -->
        <div class="lingkaran-tengah">
            <img src="gambar-tengah.jpg" alt="Visual Tengah">
        </div>

        <!-- Gambar Kotak Kanan (Ganti nama file di src sesuai gambar kanan Anda) -->
        <div class="panel-sisi panel-kanan">
            <img src="gambar-kanan.jpg" alt="Visual Kanan">
        </div>

    </section>

</body>
</html>
