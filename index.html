
<!DOCTYPE html>

<title></title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: #ffffff;
}

/* GAMBAR UTAMA */
.website {
    width: 100%;
}

.website img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* TEKS BERJALAN */
.marquee {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    background: #ffffff;
    padding: 17px 0;
    border-bottom: 1px solid #e8e8e8;
}

.marquee-track {
    display: flex;
    width: max-content;
    animation: berjalan 28s linear infinite;
}

.marquee-content {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    padding-right: 45px;
}

.marquee-content span {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2.5px;
    color: #252525;
    text-transform: uppercase;
}

.marquee-content .separator {
    margin: 0 28px;
    color: #999999;
    font-size: 12px;
}

@keyframes berjalan {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-50%);
    }
}

/* GERAK TETAP HALUS */
@media (prefers-reduced-motion: reduce) {
    .marquee-track {
        animation: none;
    }
}
</style>
</head>

<body>

        alt=""
