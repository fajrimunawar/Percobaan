<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOTRINK - Digital Information & Knowledge Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* 1. SPANDUK ATAS (Penuh pojok kiri ke kanan, utuh tidak terpotong) */
        .spanduk-atas {
            width: 100%;
            line-height: 0;
            position: relative;
            z-index: 2;
        }

        .spanduk-atas img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2. WADAH BELAH DUA FULL LAYAR + LINGKARAN TENGAH */
        .split-section {
            position: relative;
            width: 100%;
            display: flex;
            min-height: clamp(320px, 45vw, 620px); /* Tinggi proporsional di semua layar */
            overflow: hidden;
        }

        /* PANEL KIRI & KANAN (Saling bertemu di tengah, penuh dari pojok kiri ke kanan) */
        .panel-sisi {
            position: relative;
            width: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: filter 0.4s ease;
        }

        /* Warna gradien dasar profesional sebelum gambar dimasukkan */
        .panel-kiri {
            background: linear-gradient(135deg, #041d42 0%, #0a4d9c 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.25);
        }

        .panel-kanan {
            background: linear-gradient(225deg, #062b61 0%, #1565c0 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* Pengaturan Gambar di dalam Panel Kiri & Kanan */
        .panel-sisi img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Gambar mengisi penuh area kotak tanpa celah */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        /* Efek zoom halus & kilau elegan saat disentuh kursor */
        .panel-sisi:hover img {
            transform: scale(1.04);
        }

        .panel-sisi::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(4, 24, 54, 0.45), transparent 60%);
            z-index: 2;
            pointer-events: none;
        }

        /* LINGKARAN TENGAH (Tepat di perbatasan panel kiri & kanan) */
        .lingkaran-tengah {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(160px, 24vw, 330px); /* Ukuran otomatis menyesuaikan layar */
            aspect-ratio: 1 / 1; /* Selalu bulat sempurna di HP, tablet, maupun PC */
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, #e6eef8);
            border: clamp(4px, 0.6vw, 8px) solid #ffffff;
            outline: 2px solid rgba(0, 74, 153, 0.25);
            z-index: 10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease, outline-color 0.4s ease;
        }

        .lingkaran-tengah:hover {
            transform: translate(-50%, -50%) scale(1.04);
            outline-color: #0077ff;
        }

        .lingkaran-tengah img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Label Panduan Sementara (Otomatis hilang jika sudah diganti tag <img>) */
        .label-panduan {
            position: relative;
            z-index: 3;
            color: #ffffff;
            background: rgba(0, 20, 50, 0.55);
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-size: clamp(11px, 1.3vw, 15px);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .lingkaran-tengah .label-panduan {
            color: #041d42;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #0a4d9c;
        }
    </style>
</head>
<body>

    <!-- 1. SPANDUK UTAMA INFOTRINK -->
    <header class="spanduk-atas">
        <img src="file_00000000c808821199b244f777bdb40f.png" alt="Spanduk INFOTRINK">
    </header>

    <!-- 2. BAGIAN KOTAK KIRI - LINGKARAN TENGAH - KOTAK KANAN -->
    <section class="split-section">

        <!-- KOTAK KIRI (50% Lebar Layar dari Pojok Kiri ke Tengah) -->
        <div class="panel-sisi panel-kiri">
            <!-- Ganti baris <span> di bawah dengan: <img src="gambar-kiri.jpg" alt="Gambar Kiri"> -->
            <span class="label-panduan">GAMBAR KIRI</span>
        </div>

        <!-- LINGKARAN TENGAH (Menimpa tepat di garis tengah) -->
        <div class="lingkaran-tengah">
            <!-- Ganti baris <span> di bawah dengan: <img src="gambar-tengah.jpg" alt="Gambar Tengah"> -->
            <span class="label-panduan">GAMBAR<br>LINGKARAN</span>
        </div>

        <!-- KOTAK KANAN (50% Lebar Layar dari Tengah ke Pojok Kanan) -->
        <div class="panel-sisi panel-kanan">
            <!-- Ganti baris <span> di bawah dengan: <img src="gambar-kanan.jpg" alt="Gambar Kanan"> -->
            <span class="label-panduan">GAMBAR KANAN</span>
        </div>

    </section>

</body>
</html>
