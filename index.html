<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOTRINK - Digital Information & Knowledge Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            background-color: #051b3d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Mengunci 1 halaman pas tanpa kelebihan scroll */
        }

        /* Pembungkus 1 halaman penuh */
        .halaman-penuh {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1. SPANDUK ATAS (Penuh kiri-kanan, proporsional) */
        .spanduk-atas {
            width: 100%;
            flex-shrink: 0;
            line-height: 0;
            position: relative;
            z-index: 5;
            background-color: #ffffff;
        }

        .spanduk-atas img {
            width: 100%;
            max-height: 44dvh;
            height: auto;
            object-fit: cover;
            display: block;
        }

        /* 2. BAGIAN BAWAH: KOTAK KIRI - LINGKARAN TENGAH - KOTAK KANAN (Pas sisa tinggi layar) */
        .split-section {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            overflow: hidden;
            background-color: #062552;
        }

        /* PANEL KIRI & KANAN */
        .panel-sisi {
            position: relative;
            width: 50%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-kiri {
            background: linear-gradient(140deg, #041b3d 0%, #0b4a96 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.22);
        }

        .panel-kanan {
            background: linear-gradient(220deg, #062552 0%, #125cb5 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.22);
        }

        .panel-sisi img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
            z-index: 1;
        }

        .panel-sisi:hover img {
            transform: scale(1.03);
        }

        .panel-sisi::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(3, 16, 38, 0.06) 0%, rgba(3, 16, 38, 0.35) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* LINGKARAN TENGAH (Selalu di tengah area bawah & tidak keluar batas layar) */
        .lingkaran-tengah {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(120px, 22vmin, 270px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: linear-gradient(155deg, #ffffff 0%, #dce9f8 100%);
            border: clamp(4px, 0.6vmin, 8px) solid #ffffff;
            box-shadow: 0 0 0 clamp(2px, 0.3vmin, 4px) rgba(18, 92, 181, 0.5);
            z-index: 10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.35s ease;
        }

        .lingkaran-tengah:hover {
            transform: translate(-50%, -50%) scale(1.03);
        }

        .lingkaran-tengah img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <div class="halaman-penuh">

        <!-- 1. SPANDUK ATAS -->
        <header class="spanduk-atas">
            <img src="file_00000000c808821199b244f777bdb40f.png" alt="" onerror="this.style.display='none'">
        </header>

        <!-- 2. KOTAK KIRI - LINGKARAN TENGAH - KOTAK KANAN -->
        <section class="split-section">

            <div class="panel-sisi panel-kiri">
                <img src="gambar-kiri.jpg" alt="" onerror="this.style.display='none'">
            </div>

            <div class="lingkaran-tengah">
                <img src="gambar-tengah.jpg" alt="" onerror="this.style.display='none'">
            </div>

            <div class="panel-sisi panel-kanan">
                <img src="gambar-kanan.jpg" alt="" onerror="this.style.display='none'">
            </div>

        </section>

    </div>

</body>
</html>
