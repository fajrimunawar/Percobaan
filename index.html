<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotrink — Pusat Jaringan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at center, #1a2f1f 0%, #0a1410 60%, #050a08 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    color: #e8f5e9;
  }

  svg { width: 100vw; height: 100vh; display: block; }

  /* Garis akar */
  .root {
    fill: none;
    stroke: url(#rootGradient);
    stroke-linecap: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: grow 2.5s ease-out forwards;
  }

  @keyframes grow {
    to { stroke-dashoffset: 0; }
  }

  /* Node tengah */
  .center-circle {
    fill: url(#centerGradient);
    filter: url(#glow);
    animation: pulse 3s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }

  .center-text {
    fill: #e8f5e9;
    font-size: 22px;
    font-weight: 700;
    text-anchor: middle;
    letter-spacing: 2px;
  }

  .center-sub {
    fill: #9ccc9c;
    font-size: 10px;
    text-anchor: middle;
    letter-spacing: 1px;
  }

  /* Node cabang */
  .branch-node {
    cursor: pointer;
    opacity: 0;
    animation: fadeIn 0.8s ease-out forwards;
    transition: transform 0.3s ease;
  }

  .branch-node:hover .branch-circle {
    fill: #4caf50;
    r: 9;
  }

  .branch-node:hover .branch-label {
    fill: #fff;
    font-weight: 600;
  }

  .branch-circle {
    fill: #2e5d3a;
    stroke: #6fbf73;
    stroke-width: 1.5;
    transition: all 0.3s ease;
  }

  .branch-label {
    fill: #b8d8b8;
    font-size: 11px;
    text-anchor: middle;
    pointer-events: none;
    transition: fill 0.3s ease;
  }

  .branch-sub {
    fill: #6a9a6f;
    font-size: 9px;
    text-anchor: middle;
    pointer-events: none;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Detail panel */
  #detail {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: rgba(15, 30, 20, 0.95);
    border: 1px solid #3a6b45;
    border-radius: 14px;
    padding: 18px 28px;
    min-width: 280px;
    text-align: center;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  #detail.show { transform: translateX(-50%) translateY(0); }

  #detail h3 { font-size: 16px; color: #a5d6a7; margin-bottom: 4px; }
  #detail p { font-size: 12px; color: #8fbc8f; }

  /* Title */
  .title {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 6px;
    color: #4a7a52;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="title">Jaringan Infotrink</div>

<svg id="canvas" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="centerGradient">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="70%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>

    <linearGradient id="rootGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="roots"></g>
  <g id="nodes"></g>

  <!-- Pusat -->
  <circle class="center-circle" cx="500" cy="500" r="55"/>
  <text class="center-text" x="500" y="495">INFOTRINK</text>
  <text class="center-sub" x="500" y="515">WADAH INFORMASI</text>
</svg>

<div id="detail">
  <h3 id="dTitle"></h3>
  <p id="dDesc"></p>
</div>

<script>
  // ====== DATA CABANG ======
  // Ganti sesuai kebutuhan. angle dalam derajat (0 = kanan, 90 = bawah)
  const branches = [
    { label: "PT HAULUO MANDIRI UTAMA", sub: "Perusahaan", desc: "Perusahaan mitra utama Infotrink", angle: 20, dist: 300 },
    { label: "Akun Kreatif YouTube", sub: "Media Kreatif", desc: "Kanal konten kreatif video", angle: 75, dist: 320 },
    { label: "Layanan Digital", sub: "Layanan", desc: "Solusi digital & teknologi", angle: 130, dist: 290 },
    { label: "Komunitas", sub: "Jaringan", desc: "Komunitas kreatif & kolaborasi", angle: 185, dist: 310 },
    { label: "Portfolio", sub: "Karya", desc: "Kumpulan karya & proyek", angle: 240, dist: 300 },
    { label: "Kontak", sub: "Hubungi", desc: "Hubungi tim Infotrink", angle: 300, dist: 280 },
  ];

  const cx = 500, cy = 500;
  const rootsGroup = document.getElementById('roots');
  const nodesGroup = document.getElementById('nodes');

  branches.forEach((b, i) => {
    const rad = b.angle * Math.PI / 180;
    const x = cx + Math.cos(rad) * b.dist;
    const y = cy + Math.sin(rad) * b.dist;

    // Kontrol lengkungan akar (organik)
    const midX = cx + Math.cos(rad) * (b.dist * 0.5) + (Math.sin(rad) * (i % 2 === 0 ? 40 : -40));
    const midY = cy + Math.sin(rad) * (b.dist * 0.5) - (Math.cos(rad) * (i % 2 === 0 ? 40 : -40));

    // Path akar melengkung
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "root");
    path.setAttribute("d", `M ${cx} ${cy} Q ${midX} ${midY} ${x} ${y}`);
    path.setAttribute("stroke-width", 3 - (b.dist / 200));
    path.style.animationDelay = (i * 0.2) + "s";
    rootsGroup.appendChild(path);

    // Node cabang
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "branch-node");
    g.style.animationDelay = (1 + i * 0.15) + "s";

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("class", "branch-circle");
    circle.setAttribute("cx", x);
    circle.setAttribute("cy", y);
    circle.setAttribute("r", 7);
    g.appendChild(circle);

    // Label
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("class", "branch-label");
    label.setAttribute("x", x);
    label.setAttribute("y", y + 24);
    label.textContent = b.label.length > 18 ? b.label.slice(0,16)+"…" : b.label;
    g.appendChild(label);

    const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
    sub.setAttribute("class", "branch-sub");
    sub.setAttribute("x", x);
    sub.setAttribute("y", y + 38);
    sub.textContent = b.sub;
    g.appendChild(sub);

    // Interaksi klik
    g.addEventListener('click', () => showDetail(b));

    nodesGroup.appendChild(g);
  });

  function showDetail(b) {
    const d = document.getElementById('detail');
    document.getElementById('dTitle').textContent = b.label;
    document.getElementById('dDesc').textContent = b.desc;
    d.classList.add('show');
    clearTimeout(window._dt);
    window._dt = setTimeout(() => d.classList.remove('show'), 4000);
  }
</script>

</body>
</html>
