<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOTRINK - Digital Information & Knowledge Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100dvh;
            background-color: #072857;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Pembungkus utama agar selalu penuh mengikuti tinggi layar tablet/perangkat saat rotasi */
        .halaman-utama {
            width: 100%;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* 1. SPANDUK ATAS (Penuh pojok kiri ke kanan, utuh tidak terpotong) */
        .spanduk-atas {
            width: 100%;
            flex-shrink: 0;
            line-height: 0;
            position: relative;
            z-index: 5;
            background-color: #ffffff;
        }

        .spanduk-atas img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2. BAGIAN BAWAH: KOTAK KIRI - LINGKARAN TENGAH - KOTAK KANAN (Full hingga dasar layar) */
        .split-section {
            position: relative;
            width: 100%;
            flex: 1 0 auto;
            min-height: 56dvh;
            display: flex;
            overflow: hidden;
            background: linear-gradient(90deg, #051f47 0%, #0b4894 50%, #062554 100%);
        }

        /* PANEL KIRI & KANAN (Saling bertemu di tengah dari pojok kiri ke pojok kanan) */
        .panel-sisi {
            position: relative;
            width: 50%;
            min-height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-kiri {
            background: linear-gradient(135deg, #041b3d 0%, #0b4a96 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.24);
        }

        .panel-kanan {
            background: linear-gradient(225deg, #062552 0%, #125cb5 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.24);
        }

        /* Gambar pada Kotak Kiri & Kotak Kanan */
        .panel-sisi img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
        }

        .panel-sisi:hover img {
            transform: scale(1.04);
        }

        /* Aksen kilau & kedalaman visual modern di panel kiri/kanan */
        .panel-sisi::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.09), transparent 70%);
            z-index: 2;
            pointer-events: none;
        }

        .panel-sisi::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(3, 16, 38, 0.08) 0%, rgba(3, 16, 38, 0.42) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* LINGKARAN TENGAH (Tepat di perbatasan panel kiri & kanan) */
        .lingkaran-tengah {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(150px, 24vmin, 340px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: linear-gradient(155deg, #ffffff 0%, #dce9f8 100%);
            border: clamp(4px, 0.65vmin, 9px) solid #ffffff;
            box-shadow: 0 0 0 clamp(2px, 0.35vmin, 5px) rgba(18, 92, 181, 0.55);
            z-index: 10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .lingkaran-tengah:hover {
            transform: translate(-50%, -50%) scale(1.04);
        }

        .lingkaran-tengah img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <div class="halaman-utama">

        <!-- 1. SPANDUK ATAS -->
        <header class="spanduk-atas">
            <img src="file_00000000c808821199b244f777bdb40f.png" alt="" onerror="this.style.display='none'">
        </header>

        <!-- 2. KOTAK KIRI - LINGKARAN TENGAH - KOTAK KANAN -->
        <section class="split-section">

            <!-- Gambar Kotak Kiri -->
            <div class="panel-sisi panel-kiri">
                <img src="gambar-kiri.jpg" alt="" onerror="this.style.display='none'">
            </div>

            <!-- Gambar Lingkaran Tengah -->
            <div class="lingkaran-tengah">
                <img src="gambar-tengah.jpg" alt="" onerror="this.style.display='none'">
            </div>

            <!-- Gambar Kotak Kanan -->
            <div class="panel-sisi panel-kanan">
                <img src="gambar-kanan.jpg" alt="" onerror="this.style.display='none'">
            </div>

        </section>

    </div>

</body>
</html>
