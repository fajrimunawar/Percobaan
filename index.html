<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotrink</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================
   GAMBAR WEBSITE (LEBAR PENUH, TINGGI DISESUAIKAN)
   ========================================= */
.website-image {
    width: 100%;
    height: 380px; 
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #ffffff;
}

.website-image img {
    display: block;
    width: 100%; 
    height: 100%; 
    object-fit: fill; 
}

/* AREA TEKS BERJALAN */
.marquee {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    background: #ffffff;
    border-bottom: 1px solid #e8e8e8;
    padding: 19px 0;
}

.marquee-track {
    display: inline-block;
    will-change: transform;
    animation: marquee-scroll 30s linear infinite;
}

.marquee-item {
    display: inline-flex;
    align-items: center;
    padding-right: 60px;
}

.marquee-item span {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.8px;
    color: #292929;
    text-transform: uppercase;
}

.marquee-item .brand {
    font-weight: 800;
    letter-spacing: 3px;
    color: #111111;
}

.marquee-item .divider {
    margin: 0 24px;
    color: #a5a5a5;
    font-size: 12px;
}

@keyframes marquee-scroll {
    0% { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
}

/* =========================================
   SECTION 3 KOTAK (KIRI, TENGAH, KANAN)
   ========================================= */
.info-cards-section {
    width: 100%;
    padding: 60px 40px;
    background: #f8f9fa; /* Warna latar abu-abu sangat muda agar kotak putih menonjol */
    display: flex;
    justify-content: center;
    gap: 30px; /* Jarak antar kotak */
    flex-wrap: wrap; /* Agar turun ke bawah jika layar HP */
}

/* Gaya Dasar Kotak */
.card {
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    width: calc(33.333% - 20px); /* 3 kotak sejajar */
    min-width: 280px; /* Batas minimum lebar kotak */
    max-width: 400px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid #eaeaea;
    display: flex;
    flex-direction: column;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

/* Area Gambar di dalam Kotak */
.card-image {
    width: 100%;
    height: 200px; /* Tinggi gambar di dalam kotak */
    overflow: hidden;
    background: #e9ecef; /* Warna placeholder jika gambar belum load */
}

.card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Menjaga gambar tetap proporsional tanpa gepeng */
    transition: transform 0.3s ease;
}

.card:hover .card-image img {
    transform: scale(1.05); /* Efek zoom saat di-hover */
}

/* Area Judul di Bawah Gambar */
.card-title {
    padding: 20px 15px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #111111;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border-top: 2px solid #0056b3; /* Garis biru pemisah */
    background: #ffffff;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* RESPONSIVE UNTUK HP */
@media (max-width: 900px) {
    .info-cards-section {
        padding: 40px 20px;
        gap: 20px;
    }
    
    .card {
        width: calc(50% - 10px); /* Jadi 2 kolom di tablet */
    }
}

@media (max-width: 600px) {
    .website-image {
        height: 200px; 
    }

    .marquee {
        padding: 16px 0;
    }

    .marquee-item span {
        font-size: 11px;
        letter-spacing: 1.3px;
    }

    .marquee-item .divider {
        margin: 0 17px;
    }
    
    .marquee-track {
        animation-duration: 22s; 
    }

    .card {
        width: 100%; /* Jadi 1 kolom penuh di HP */
        max-width: 100%;
    }
}

@media (prefers-reduced-motion: reduce) {
    .marquee-track {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- GAMBAR UTAMA -->
<main class="website-image">
    <img
        src="file_0000000005b0821198b8019f43a73116.webp"
        alt="Infotrink Banner"
    >
</main>

<!-- TEKS BERJALAN -->
<section class="marquee">
    <div class="marquee-track">
        <div class="marquee-item">
            <span class="brand">INFOTRINK</span>
            <span class="divider">|</span>
            <span>Pusat Media Digital Terpercaya yang Menghimpun, Mengemas, dan Menyajikan Informasi serta Perkembangan Terkini dari Beragam Aspek Kehidupan dalam Satu Wadah Terpadu, Akurat, dan Berkelas</span>
            <span class="divider">◆</span>
        </div>
    </div>
</section>

<!-- SECTION 3 KOTAK -->
<section class="info-cards-section">
    
    <!-- Kotak 1 -->
    <div class="card">
        <div class="card-image">
            <!-- Ganti URL src di bawah dengan gambar Anda -->
            <img src="https://images.unsplash.com/photo-1456324504439-367cee3b3c32?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Pengetahuan Infotrink">
        </div>
        <div class="card-title">PENGETAHUAN INFOTRINK</div>
    </div>

    <!-- Kotak 2 -->
    <div class="card">
        <div class="card-image">
            <!-- Ganti URL src di bawah dengan gambar Anda -->
            <img src="https://images.unsplash.com/photo-1507925921958-8a62f3d1a50d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Struktur Kerangka">
        </div>
        <div class="card-title">STRUKTUR KERANGKA</div>
    </div>

    <!-- Kotak 3 -->
    <div class="card">
        <div class="card-image">
            <!-- Ganti URL src di bawah dengan gambar Anda -->
            <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Pusat Informasi">
        </div>
        <div class="card-title">PUSAT INFORMASI</div>
    </div>

</section>

</body>
</html>
