<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOTRINK - Digital Information & Knowledge Media</title>
    <style>
        /* Reset margin dan padding bawaan browser agar menempel ke pojok layar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* Wadah khusus spanduk atas */
        .header-banner {
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            line-height: 0; /* Menghilangkan celah kosong tipis di bawah gambar */
        }

        /* Pengaturan gambar agar penuh kiri-kanan dan tidak terpotong */
        .header-banner img {
            width: 100%;        /* Memenuhi lebar layar dari pojok kiri ke kanan */
            height: auto;       /* Tinggi otomatis menyesuaikan proporsi asli gambar */
            display: block;     /* Memastikan gambar tampil utuh sebagai blok */
            object-fit: contain;/* Menjamin tidak ada bagian gambar yang terpotong */
        }
    </style>
</head>
<body>

    <!-- Bagian Spanduk Atas -->
    <header class="header-banner">
        <img src="banner-infotrink.png" alt="Spanduk INFOTRINK - Digital Information & Knowledge Media">
    </header>

    <!-- Area Konten Selanjutnya (Akan kita isi di tahap berikutnya) -->
    <main>
        
    </main>

</body>
</html>
