<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOTRINK - Digital Information & Knowledge Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* 1. SPANDUK ATAS (Penuh dari pojok kiri ke pojok kanan, utuh tidak terpotong) */
        .spanduk-atas {
            width: 100%;
            line-height: 0;
            position: relative;
            z-index: 5;
            background-color: #ffffff;
        }

        .spanduk-atas img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2. WADAH KOTAK KIRI - LINGKARAN TENGAH - KOTAK KANAN (Proporsi seimbang, tidak kegedean) */
        .split-section {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 7; /* Mengunci tinggi agar proporsional & tidak memanjang berlebihan */
            min-height: 220px;
            max-height: 460px;
            display: flex;
            overflow: hidden;
            background-color: #062552;
        }

        /* PANEL KIRI & KANAN (Saling bertemu di tengah dari pojok kiri ke pojok kanan) */
        .panel-sisi {
            position: relative;
            width: 50%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-kiri {
            background: linear-gradient(135deg, #041b3d 0%, #0b4a96 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.25);
        }

        .panel-kanan {
            background: linear-gradient(225deg, #062552 0%, #125cb5 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* Gambar pada Kotak Kiri & Kanan menyesuaikan wadah dengan rapi */
        .panel-sisi img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            transition: transform 0.5s ease;
            z-index: 1;
        }

        .panel-sisi:hover img {
            transform: scale(1.03);
        }

        .panel-sisi::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(3, 16, 38, 0.06) 0%, rgba(3, 16, 38, 0.3) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* LINGKARAN TENGAH (Menyesuaikan tinggi kotak secara proporsional) */
        .lingkaran-tengah {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 62%; /* Ukuran lingkaran selalu 62% dari tinggi kotak agar tidak kebesaran/kekecilan */
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: linear-gradient(155deg, #ffffff 0%, #dce9f8 100%);
            border: clamp(3px, 0.5vw, 7px) solid #ffffff;
            box-shadow: 0 0 0 clamp(2px, 0.25vw, 4px) rgba(18, 92, 181, 0.5);
            z-index: 10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.35s ease;
        }

        .lingkaran-tengah:hover {
            transform: translate(-50%, -50%) scale(1.04);
        }

        .lingkaran-tengah img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 1. SPANDUK ATAS -->
    <header class="spanduk-atas">
        <img src="file_00000000c808821199b244f777bdb40f.png" alt="" onerror="this.style.display='none'">
    </header>

    <!-- 2. KOTAK KIRI - LINGKARAN TENGAH - KOTAK KANAN -->
    <section class="split-section">

        <!-- Gambar Kotak Kiri -->
        <div class="panel-sisi panel-kiri">
            <img src="gambar-kiri.jpg" alt="" onerror="this.style.display='none'">
        </div>

        <!-- Gambar Lingkaran Tengah -->
        <div class="lingkaran-tengah">
            <img src="gambar-tengah.jpg" alt="" onerror="this.style.display='none'">
        </div>

        <!-- Gambar Kotak Kanan -->
        <div class="panel-sisi panel-kanan">
            <img src="gambar-kanan.jpg" alt="" onerror="this.style.display='none'">
        </div>

    </section>

</body>
</html>
