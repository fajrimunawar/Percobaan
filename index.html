<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOTRINK</title>
    <style>
        /* Menghilangkan semua jarak bawaan browser secara total */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden; /* Mencegah geser ke samping (kelewatan) */
        }

        /* Wadah penuh selebar layar */
        .banner-penuh {
            width: 100vw; /* 100% lebar layar dari pojok kiri ke kanan */
            margin: 0;
            padding: 0;
            line-height: 0;
        }

        /* Pengaturan gambar agar mentok kiri-kanan & proporsional */
        .banner-penuh img {
            width: 100%;      /* Melebar penuh dari kiri ke kanan */
            height: auto;     /* Tinggi menyesuaikan otomatis agar gambar lebih besar & tidak terpotong */
            display: block;   /* Menghilangkan celah kosong */
        }
    </style>
</head>
<body>

    <div class="banner-penuh">
        <!-- Ganti 'nama-file-gambar.jpg' sesuai nama file gambar Anda di GitHub -->
        <img src="file_0000000005b0821198b8019f43a73116.webp" alt="">
    </div>

</body>
</html>
