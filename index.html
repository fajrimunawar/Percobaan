<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOTRINK - Digital Information & Knowledge Media</title>
    <style>
        /* Menghilangkan jarak bawaan browser agar menempel sempurna di pojok */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
        }

        /* Wadah banner di bagian paling atas */
        .header-banner {
            width: 100%;
            background-color: #ffffff;
            line-height: 0; /* Menghilangkan celah kosong tipis di bawah gambar */
        }

        /* Pengaturan gambar poster */
        .header-banner img {
            width: 100%;          /* Penuh dari pojok kiri ke pojok kanan */
            max-height: 50vh;     /* Tinggi maksimal 50% dari layar */
            height: auto;         /* Menjaga proporsi asli gambar agar tidak gepeng */
            object-fit: contain;  /* Memastikan seluruh gambar terlihat utuh dan TIDAK TERPOTONG */
            display: block;
        }

        /* Contoh area konten di bawah poster */
        .konten {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- Bagian Poster Atas -->
    <header class="header-banner">
        <!-- Ganti 'nama-file-gambar.jpg' dengan nama file gambar Anda -->
        <img src="file_0000000005b0821198b8019f43a73116.webp" alt="INFOTRINK Digital Information & Knowledge Media">
    </header>

</body>
</html>
