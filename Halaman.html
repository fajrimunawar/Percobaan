<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infotrink</title>
<meta name="description" content="INFOTRINK — satu wadah untuk perjalanan gagasan dan berbagai karya. Menghimpun informasi dan dokumentasi di beragam bidang, dirangkum dari awal mula hingga pengembangannya.">
<meta name="theme-color" content="#81F6EF">
<link rel="icon" href="1000007372.png" sizes="any">
<link rel="icon" href="1000007372.png" type="image/png" sizes="32x32">
<link rel="icon" href="1000007372.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="1000007372.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ VARIABEL & DASAR ============ */
:root{
  --teal-deep:#0B3B3A;
  --teal:#0B6E6A;
  --teal-soft:#5B7A78;
  --cyan:#81F6EF;
  --gold:#D9B45B;
  --ink:#1F2937;
  --font:'Open Sans','Segoe UI',Tahoma,sans-serif;
  --bg-grad:linear-gradient(180deg,#81F6EF 0%,#9CF4ED 22%,#B2FBF6 45%,#CFFCF6 68%,#E1FFFD 88%,#E8FEFC 100%);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--cyan);color:var(--teal-deep);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
#container{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;background:var(--bg-grad)}
body.menu-locked #container{overflow:hidden}
#wrapper{width:100%;position:relative;overflow:hidden}
#content{position:absolute;top:0;left:0;width:1280px;transform-origin:top left}

@keyframes marqueeHero{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes marqueeFoot{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ============ HERO SLIDE ============ */
.slide{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--bg-grad)}
.hero-dim{transition:opacity .3s ease}
.slide.menu-open .hero-dim{opacity:.22;pointer-events:none}

.site-header{position:absolute;top:32px;left:70px;right:70px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.logo-pill{display:flex;align-items:center;gap:12px;padding:8px 22px 8px 10px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-radius:999px;box-shadow:0 4px 16px rgba(11,59,58,.12);border:1px solid rgba(255,255,255,.6);text-decoration:none;cursor:pointer}
.logo-pill .icon{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(11,59,58,.15))}
.logo-pill .text{width:125px;height:40px;object-fit:contain}
.site-nav{display:flex;align-items:center;gap:32px;padding:10px 26px;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border-radius:999px;box-shadow:0 4px 16px rgba(11,59,58,.10)}
.nav-link{font-size:15px;font-weight:600;color:var(--teal-deep);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;letter-spacing:.2px;cursor:pointer;display:inline-block;transition:color .2s,border-color .2s}
.nav-link:hover{color:var(--teal)}
.nav-link.on{font-weight:700;color:var(--teal);border-bottom-color:var(--teal)}

.hero-text{position:absolute;left:70px;top:150px;width:540px;z-index:5}
.hero-title{font-weight:800;font-size:32px;line-height:1.3;color:var(--teal-deep);letter-spacing:-.5px;text-transform:uppercase;margin:0;text-align:left}
.hero-quote{display:flex;align-items:flex-start;margin-top:44px;gap:10px}
.hero-quote img{flex-shrink:0;width:48px;height:34px;margin-top:-12px;user-select:none}
.hero-quote p{font-weight:400;font-size:16.5px;line-height:1.6;color:var(--ink);text-align:justify;text-justify:inter-word;width:450px;margin:0}
.hero-actions{display:flex;justify-content:space-between;align-items:center;margin-top:52px;margin-left:58px;width:450px;position:relative;z-index:10}
.btn-image{position:relative;display:inline-flex;align-items:center;height:44px;cursor:pointer;text-decoration:none;z-index:5}
.btn-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0}
.btn-image span{position:relative;z-index:1;font-size:16px;font-weight:700;color:#1a1a1a;letter-spacing:.3px;pointer-events:none}
.btn-telusuri{justify-content:flex-end;padding-right:40px;padding-left:60px}
.btn-kenali{justify-content:flex-start;padding-left:40px;padding-right:60px}

.hero-marquee{margin-top:44px;margin-left:58px;width:450px;padding:10px 0;background:rgba(11,110,106,.07);border-radius:999px;border:1px solid rgba(11,110,106,.22);overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,black 8%,black 92%,transparent);mask-image:linear-gradient(90deg,transparent,black 8%,black 92%,transparent)}
.hero-marquee-inner{display:inline-flex;align-items:center;animation:marqueeHero 40s linear infinite;will-change:transform}
.hm-group{display:inline-flex;align-items:center}
.hm-item{display:inline-flex;align-items:center}
.hm-text{font-size:12px;font-weight:600;letter-spacing:2px;color:rgba(11,110,106,.85);padding:0 22px;white-space:nowrap}
.hm-dot{color:rgba(11,110,106,.4);font-size:11px;margin:0 5px}

/* --- PERUBAHAN UKURAN GAMBAR HERO DI SINI --- */
.hero-photos{position:absolute;left:640px;top:150px;width:460px;height:480px;z-index:3}
.photo-card{position:absolute;width:210px;height:210px}
.photo-card::before{content:"";position:absolute;top:14px;left:-14px;width:100%;height:100%;background:linear-gradient(135deg,#0B6E6A,#5B7A78);border-radius:18px;opacity:.3}
.photo-frame{position:relative;width:100%;height:100%;padding:8px;background:linear-gradient(155deg,rgba(255,255,255,.62),rgba(255,255,255,.36) 55%,rgba(129,246,239,.38));border:1px solid rgba(255,255,255,.7);border-radius:18px;box-shadow:0 8px 22px rgba(11,59,58,.12);backdrop-filter:blur(6px)}
.photo-frame img{width:194px;height:194px;object-fit:cover;border-radius:12px;display:block}
.photo-tl{top:0;left:0}
.photo-tr{top:16px;left:240px}
.photo-bl{top:230px;left:0}
.photo-br{top:246px;left:240px}

/* ============ DAFTAR ISI OVERLAY ============ */
.overlay-menu{position:absolute;inset:0;visibility:hidden;pointer-events:none;transition:visibility 0s linear .7s}
.overlay-menu.open{visibility:visible;transition-delay:0s}
.overlay-menu.open .ov-box,.overlay-menu.open .ov-x{pointer-events:auto}
.ov-svg{position:absolute;inset:0;pointer-events:none;z-index:20}
.ov-dot-start,.ov-dot-end{fill:var(--teal);opacity:0;transform:scale(0);transform-origin:center;transform-box:fill-box;transition:opacity .25s ease,transform .25s ease}
.ov-dot-end{transition-delay:.1s}
.ov-dot-start{transition-delay:.4s}
.overlay-menu.open .ov-dot-start{opacity:1;transform:scale(1);transition-delay:.05s}
.overlay-menu.open .ov-dot-end{opacity:1;transform:scale(1);transition-delay:.4s}
.ov-line{stroke:var(--teal);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .45s ease;transition-delay:.15s}
.overlay-menu.open .ov-line{stroke-dashoffset:0;transition-delay:.1s}
.ov-box{position:absolute;left:70px;top:130px;width:1140px;height:560px;background:rgba(255,255,255,.98);border-radius:0 0 20px 20px;box-shadow:0 12px 40px rgba(11,59,58,0.22);z-index:15;padding:28px 36px;overflow-y:auto;opacity:0;transform:scaleY(0);transform-origin:center top;transition:opacity .4s ease,transform .4s ease;transition-delay:.05s}
.overlay-menu.open .ov-box{opacity:1;transform:scaleY(1);transition-delay:.25s}
.ov-head{opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease}
.overlay-menu.open .ov-head{opacity:1;transform:translateY(0);transition-delay:.45s}
.ov-h2{font-size:28px;font-weight:800;color:var(--teal-deep);margin:0;letter-spacing:-.3px}
.ov-desc{font-size:14px;color:var(--teal-soft);margin:4px 0 0;font-weight:500}
.ov-divider{height:2px;background:linear-gradient(90deg,var(--teal),rgba(11,110,106,.1));margin:14px 0 18px;opacity:0;transform:scaleX(0);transform-origin:left center;transition:opacity .25s ease,transform .35s ease}
.overlay-menu.open .ov-divider{opacity:1;transform:scaleX(1);transition-delay:.5s}
.ov-cards{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px}
.ov-card{padding:16px 18px;background:linear-gradient(135deg,#F0FAF8,#DCF3EC);border-radius:14px;border:1px solid rgba(11,110,106,.15);opacity:0;transform:translateY(20px);transition:all .3s ease;box-shadow:0 4px 14px rgba(11,59,58,.05)}
.ov-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(11,59,58,.12);border-color:var(--teal)}
.overlay-menu.open .ov-card{opacity:1;transform:translateY(0);transition-delay:var(--d,0s)}
.ov-num{display:inline-block;font-size:11px;font-weight:700;color:var(--teal);background:rgba(11,110,106,.1);padding:3px 9px;border-radius:6px;margin-bottom:8px;letter-spacing:.5px}
.ov-title{font-size:14px;font-weight:700;color:var(--teal-deep);min-height:38px;line-height:1.35}
.ov-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--teal);color:#fff;border:none;border-radius:999px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;margin-top:10px;letter-spacing:.3px;transition:background .2s,transform .2s;text-decoration:none}
.ov-btn:hover{background:var(--teal-deep);transform:translateX(3px)}
.ov-x{position:absolute;left:1154px;top:146px;width:38px;height:38px;border-radius:50%;background:var(--teal-deep);color:#fff;border:none;font-family:var(--font);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:18;opacity:0;transform:scale(0) rotate(-90deg);box-shadow:0 4px 12px rgba(11,59,58,.25);transition:opacity .25s,transform .25s,background .2s}
.overlay-menu.open .ov-x{opacity:1;transform:scale(1) rotate(0);transition-delay:.55s}
.overlay-menu.open .ov-x:hover{background:#d32f2f;transform:scale(1.1) rotate(0);transition-delay:0s}

/* ============ SECTION BERSAMA ============ */
.sections{position:relative;width:1280px}
.pill-badge{display:inline-block;font-size:13px;font-weight:700;color:var(--teal);background:rgba(11,110,106,.1);padding:6px 14px;border-radius:999px;letter-spacing:1px;margin-bottom:18px}

/* ============ SECTION 1: INTRO ============ */
.sec-intro{position:relative;min-height:700px;padding:50px 80px 44px;background:#fff}
.sec-intro::after{content:"";display:table;clear:both}
.sec-intro .float-img{float:right;margin-top:54px;margin-left:40px;margin-bottom:24px;position:relative}
.sec-intro .float-img::before{content:"";position:absolute;top:18px;left:-18px;width:100%;height:100%;background:linear-gradient(135deg,#0B6E6A,#5B7A78);border-radius:22px;opacity:.3}
.sec-intro .img-frame{position:relative;width:516px;height:348px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(11,110,106,.10),0 14px 34px rgba(11,59,58,.18);border:6px solid #fff}
.sec-intro .img-frame img{width:100%;height:100%;object-fit:cover;display:block}
.sec-intro .img-badge{position:absolute;bottom:16px;left:16px;padding:10px 16px;background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.sec-intro .img-badge .label{font-size:11px;color:var(--teal-soft);font-weight:600;letter-spacing:.5px}
.sec-intro .img-badge .title{font-size:14px;color:var(--teal-deep);font-weight:700}
.sec-intro h2{font-size:25.5px;font-weight:800;color:var(--teal-deep);margin:0 0 22px;letter-spacing:.3px;line-height:1.3;text-transform:uppercase;white-space:nowrap}
.sec-intro p{font-size:16.5px;line-height:1.75;color:var(--ink);margin:0;text-align:justify;text-justify:inter-word}

/* ============ SECTION 2: ALUR PERJALANAN ============ */
.sec-flow{position:relative;padding:56px 80px 58px;background:#fff;border-top:1px solid rgba(11,110,106,.12);border-bottom:1px solid rgba(11,110,106,.12);background-image:linear-gradient(rgba(11,110,106,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(11,110,106,.035) 1px,transparent 1px);background-size:40px 40px;overflow:hidden}
.sec-flow .pill-badge{font-size:12.5px;letter-spacing:1.5px;margin-bottom:16px}
.sec-flow h2{font-size:27px;font-weight:800;color:var(--teal-deep);margin:0 0 12px;letter-spacing:.5px;line-height:1.3;max-width:1060px;text-transform:uppercase}
.sec-flow .lede{font-size:15px;line-height:1.72;color:#37605D;margin:0 0 10px;text-align:justify;text-justify:inter-word}
.flow-chart{position:relative;height:472px;margin-top:14px}
.flow-chart svg{position:absolute;inset:0}
.flow-bg{fill:none;stroke:rgba(11,110,106,.08);stroke-width:9;stroke-linecap:round}
.flow-line{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:7 7;stroke-linecap:round;opacity:.5}
.flow-cap{stroke:var(--teal);stroke-width:2;stroke-dasharray:5 6;opacity:.45;fill:none}
.flow-dot{fill:var(--teal);opacity:.45}
.flow-arrow{fill:var(--teal);opacity:.7}
.stage{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--teal);box-shadow:0 0 0 6px rgba(11,110,106,.09),0 6px 14px rgba(11,59,58,.14);display:flex;align-items:center;justify-content:center;z-index:1}
.stage-icon{display:block}
.stage-label{position:absolute;text-align:center;display:flex;flex-direction:column;gap:4px}
.stage-name{font-size:14.5px;font-weight:800;color:var(--teal-deep);letter-spacing:.2px;text-transform:uppercase;white-space:nowrap}
.stage-desc{font-size:12.3px;line-height:1.5;color:#4A6A67}
.stage--1{left:56px;top:321px} .stage-label--1{left:2px;top:366px;width:156px}
.stage--2{left:211px;top:86px} .stage-label--2{left:150px;top:2px;width:170px}
.stage--3{left:366px;top:321px} .stage-label--3{left:305px;top:366px;width:170px}
.stage--4{left:521px;top:86px} .stage-label--4{left:460px;top:2px;width:170px}
.stage--5{left:676px;top:321px} .stage-label--5{left:615px;top:366px;width:170px}
.stage--6{left:831px;top:86px} .stage-label--6{left:770px;top:2px;width:170px}
.stage--7{left:986px;top:321px} .stage-label--7{left:925px;top:366px;width:170px}

.mobile-flow-list { display: none !important; }

/* ============ SECTION 2B: PETA BIDANG (POHON HIERARKI) ============ */
.sec-scope{position:relative;padding:56px 80px 58px;background:#fff;border-bottom:1px solid rgba(11,110,106,.12);background-image:linear-gradient(rgba(11,110,106,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(11,110,106,.03) 1px,transparent 1px);background-size:60px 60px;overflow:hidden}
.sec-scope .pill-badge{font-size:12.5px;letter-spacing:1.5px;margin-bottom:16px}
.sec-scope h2{font-size:27px;font-weight:800;color:var(--teal-deep);margin:0 0 12px;letter-spacing:.5px;line-height:1.3;max-width:1060px;text-transform:uppercase}
.sec-scope .lede{font-size:15px;line-height:1.72;color:#37605D;margin:0 0 10px;text-align:justify;text-justify:inter-word}
.tree-chart{position:relative;height:560px;margin-top:26px}
.tree-chart svg{position:absolute;inset:0}
.tree-bg{fill:none;stroke:rgba(11,110,106,.12);stroke-width:7;stroke-linecap:round}
.tree-line{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round;opacity:.5}
.tree-dot{fill:var(--teal);opacity:.5}
.tree-root{position:absolute;left:0;top:205px;width:250px;height:150px;background:var(--teal-deep);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 20px;box-shadow:0 10px 24px rgba(11,59,58,.28);z-index:1}
.tree-root .tag{font-size:9.5px;font-weight:700;letter-spacing:2px;color:var(--cyan);background:rgba(129,246,239,.12);border:1px solid rgba(129,246,239,.35);padding:3px 10px;border-radius:999px;margin-bottom:7px}
.tree-root .nm{font-size:21px;font-weight:800;color:#fff;letter-spacing:.5px}
.tree-root .sb{font-size:11px;color:rgba(255,255,255,.75);margin-top:4px;line-height:1.4}
.tree-branch{position:absolute;left:330px;width:170px;height:118px;background:#fff;border:2px solid var(--teal);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 12px;box-shadow:0 0 0 5px rgba(11,59,58,.08),0 6px 14px rgba(11,59,58,.12);z-index:1;transition:box-shadow .2s,transform .2s}
.tree-branch:hover{transform:translateX(3px);box-shadow:0 0 0 5px rgba(11,59,58,.14),0 8px 18px rgba(11,59,58,.16)}
.tree-branch .num{display:inline-block;font-size:10px;font-weight:700;color:var(--teal);background:rgba(11,110,106,.1);padding:2px 9px;border-radius:6px;margin-bottom:6px;letter-spacing:.5px}
.tree-branch .nm{font-size:15px;font-weight:800;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.2px;line-height:1.25}
.tree-branch .hint{font-size:10.5px;color:var(--teal-soft);margin-top:4px;line-height:1.3}
.tree-sub{position:absolute;left:580px;width:540px;height:48px;background:linear-gradient(135deg,#F0FAF8,#DCF3EC);border:1px solid rgba(11,110,106,.14);border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 3px 10px rgba(11,59,58,.06);z-index:1;transition:border-color .2s,transform .2s}
.tree-sub:hover{border-color:rgba(11,110,106,.4);transform:translateX(3px)}
.tree-sub .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex-shrink:0;box-shadow:0 0 0 3px rgba(11,110,106,.15)}
.tree-sub .tt{font-size:13px;font-weight:800;color:var(--teal-deep);white-space:nowrap}
.tree-sub .dd{font-size:12px;color:#4A6A67;line-height:1.35;flex:1;min-width:0}
.branch--1{top:0}.branch--2{top:148px}.branch--3{top:296px}.branch--4{top:444px}
.sub--1a{top:4px}.sub--1b{top:66px}.sub--2a{top:152px}.sub--2b{top:214px}
.sub--3a{top:300px}.sub--3b{top:362px}.sub--4a{top:448px}.sub--4b{top:510px}
.tree-note{text-align:center;font-size:12.5px;font-style:italic;color:var(--teal-soft);margin:20px auto 0;max-width:780px;line-height:1.6}

.mobile-tree-list { display: none !important; }

/* ============ SECTION 2C: PENJELASAN EMPAT CABANG BIDANG ============ */
.sec-domains{position:relative;padding:64px 80px 72px;background:linear-gradient(180deg,#F7FCFB 0%,#FFFFFF 35%,#F4FBF9 100%);overflow:hidden}
.sec-domains::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--teal) 20%,var(--gold) 50%,var(--teal) 80%,transparent)}

.dom-header{width:100%;margin-bottom:46px;padding-bottom:28px;border-bottom:1.5px solid rgba(11,110,106,.14)}
.dom-header-top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:14px}
.dom-header .pill-badge{margin-bottom:0;font-size:12.5px;letter-spacing:1.5px}
.dom-header h2{font-size:28px;font-weight:800;color:var(--teal-deep);margin:0 0 14px;letter-spacing:.4px;line-height:1.3;text-transform:uppercase;width:100%}
.dom-header .lede{font-size:15.5px;line-height:1.78;color:#325855;margin:0;width:100%;text-align:justify;text-justify:inter-word}

.dom-list{display:flex;flex-direction:column;gap:30px;position:relative}
.dom-row{display:grid;grid-template-columns:410px 1fr;align-items:stretch;background:#fff;border-radius:20px;border:1px solid rgba(11,110,106,.15);box-shadow:0 12px 30px rgba(11,59,58,.07);overflow:hidden;position:relative;transition:transform .25s ease,box-shadow .25s ease}
.dom-row:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(11,59,58,.12)}
.dom-row--reverse{grid-template-columns:1fr 410px}
.dom-row--reverse .dom-title-panel{order:2}
.dom-row--reverse .dom-desc-panel{order:1}

.dom-title-panel{position:relative;padding:34px 36px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
.dom-title-panel::after{content:"";position:absolute;right:-40px;bottom:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(129,246,239,.18),transparent 70%);pointer-events:none}
.dom-row--reverse .dom-title-panel::after{right:auto;left:-40px}

.dom-row--1 .dom-title-panel{background:linear-gradient(145deg,#0B3B3A 0%,#0E5956 100%)}
.dom-row--2 .dom-title-panel{background:linear-gradient(145deg,#0E4F4C 0%,#0B3B3A 100%)}
.dom-row--3 .dom-title-panel{background:linear-gradient(145deg,#093332 0%,#12635F 100%)}
.dom-row--4 .dom-title-panel{background:linear-gradient(145deg,#105653 0%,#093130 100%)}

.dom-row--1 .dom-title-panel{border-left:5px solid var(--cyan)}
.dom-row--2 .dom-title-panel{border-right:5px solid var(--gold)}
.dom-row--3 .dom-title-panel{border-left:5px solid var(--gold)}
.dom-row--4 .dom-title-panel{border-right:5px solid var(--cyan)}

.dom-panel-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;position:relative;z-index:1}
.dom-num-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:999px;background:rgba(129,246,239,.14);border:1px solid rgba(129,246,239,.35);font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--cyan);text-transform:uppercase}

.dom-panel-main{position:relative;z-index:1}
.dom-kicker{font-size:11.5px;font-weight:700;letter-spacing:1.8px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;display:block}
.dom-title{font-size:24px;font-weight:800;color:#fff;margin:0 0 10px;line-height:1.25;letter-spacing:.3px;text-transform:uppercase}
.dom-subtitle{font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.82);margin:0}

.dom-panel-foot{margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.dom-subtag{font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:4px 11px;border-radius:6px;letter-spacing:.4px}

.dom-desc-panel{padding:34px 40px;display:flex;flex-direction:column;justify-content:center;background:#fff;position:relative}
.dom-desc-label{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:1.6px;color:var(--teal);text-transform:uppercase;margin-bottom:12px}
